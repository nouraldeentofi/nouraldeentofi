<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Nour Aldeen Tofi — AI Automation Engineer and Senior Frontend Developer">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.2" fill="#18253C"/>
    </pattern>
    <radialGradient id="warm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EA4B71" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#EA4B71" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EA4B71"/>
      <stop offset="55%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="340" rx="20" fill="#0B1220"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <ellipse cx="880" cy="130" rx="300" ry="200" fill="url(#warm)"/>
  <ellipse cx="1130" cy="250" rx="240" ry="180" fill="url(#cool)"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#hair)" opacity="0.85"/>

  <!-- ── identity ─────────────────────────────────────────── -->
  <text x="56" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" letter-spacing="3.4" fill="#EA4B71">AI AUTOMATION ENGINEER</text>

  <text x="56" y="164" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="50" font-weight="700" fill="#E9EFF8">Nour Aldeen Tofi</text>

  <text x="56" y="200" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="19" fill="#8494AC">Senior Frontend Developer · Al Khobar, Saudi Arabia</text>

  <rect x="56" y="222" width="52" height="2" rx="1" fill="#EA4B71"/>

  <text x="56" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#38BDF8">n8n · GPT-4o Vision · MCP · React 19 · TypeScript</text>

  <text x="56" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" fill="#56688A">// Arabic invoices in. Clean structured data out.</text>

  <!-- ── the pipeline ─────────────────────────────────────── -->
  <g>
    <!-- source: an Arabic invoice (RTL lines) -->
    <rect x="668" y="96" width="104" height="140" rx="10" fill="#0F1829" stroke="#22314C" stroke-width="1.5"/>
    <rect x="684" y="112" width="72" height="5" rx="2.5" fill="#33456A"/>
    <rect x="704" y="126" width="52" height="5" rx="2.5" fill="#2A3A5A"/>
    <rect x="694" y="140" width="62" height="5" rx="2.5" fill="#2A3A5A"/>
    <rect x="716" y="154" width="40" height="5" rx="2.5" fill="#2A3A5A"/>
    <rect x="684" y="168" width="72" height="5" rx="2.5" fill="#2A3A5A"/>
    <rect x="712" y="182" width="44" height="5" rx="2.5" fill="#2A3A5A"/>
    <rect x="700" y="200" width="56" height="7" rx="3.5" fill="#EA4B71" opacity="0.85"/>
    <text x="720" y="256" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.6" fill="#56688A">INVOICE.JPG</text>

    <!-- connector 1 -->
    <path d="M778 166 H 820" stroke="#EA4B71" stroke-width="1.6" stroke-dasharray="5 7" opacity="0.75">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="0.9s" repeatCount="indefinite"/>
    </path>

    <!-- node: extract -->
    <rect x="822" y="142" width="48" height="48" rx="14" fill="#111A2B" stroke="#EA4B71" stroke-width="1.6"/>
    <circle cx="846" cy="166" r="7" fill="none" stroke="#EA4B71" stroke-width="1.8" filter="url(#soft)"/>
    <path d="M851 171 L856 176" stroke="#EA4B71" stroke-width="1.8" stroke-linecap="round"/>
    <text x="846" y="212" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.4" fill="#56688A">EXTRACT</text>

    <!-- connector 2 -->
    <path d="M876 166 H 918" stroke="#C084FC" stroke-width="1.6" stroke-dasharray="5 7" opacity="0.75">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
    </path>

    <!-- node: verify -->
    <rect x="920" y="142" width="48" height="48" rx="14" fill="#111A2B" stroke="#C084FC" stroke-width="1.6"/>
    <path d="M934 166 L942 174 L955 158" fill="none" stroke="#C084FC" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
    <text x="944" y="212" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.4" fill="#56688A">VERIFY</text>

    <!-- connector 3 -->
    <path d="M974 166 H 1016" stroke="#38BDF8" stroke-width="1.6" stroke-dasharray="5 7" opacity="0.75">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
    </path>

    <!-- output: structured record -->
    <rect x="1018" y="96" width="126" height="140" rx="10" fill="#0F1829" stroke="#38BDF8" stroke-width="1.5" opacity="0.95"/>
    <rect x="1034" y="114" width="30" height="5" rx="2.5" fill="#38BDF8"/>
    <rect x="1070" y="114" width="52" height="5" rx="2.5" fill="#33456A"/>
    <rect x="1034" y="132" width="36" height="5" rx="2.5" fill="#38BDF8"/>
    <rect x="1076" y="132" width="46" height="5" rx="2.5" fill="#33456A"/>
    <rect x="1034" y="150" width="26" height="5" rx="2.5" fill="#38BDF8"/>
    <rect x="1066" y="150" width="56" height="5" rx="2.5" fill="#33456A"/>
    <rect x="1034" y="168" width="40" height="5" rx="2.5" fill="#38BDF8"/>
    <rect x="1080" y="168" width="42" height="5" rx="2.5" fill="#33456A"/>
    <rect x="1034" y="186" width="32" height="5" rx="2.5" fill="#38BDF8"/>
    <rect x="1072" y="186" width="50" height="5" rx="2.5" fill="#33456A"/>
    <rect x="1034" y="206" width="88" height="7" rx="3.5" fill="#38BDF8" opacity="0.55"/>
    <text x="1081" y="256" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.6" fill="#56688A">STRUCTURED.JSON</text>
  </g>

  <text x="1144" y="308" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" letter-spacing="2.4" fill="#33456A">NOUR.DEV</text>
</svg>
